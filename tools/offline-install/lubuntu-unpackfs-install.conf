# Lubuntu 用 unpackfs.conf の上書き原文 (統合層 install 用)。
# 統合 ISO の Lubuntu の連鎖を、起動の overlay と同じ順で展開する。
# 先頭だけ無条件で、残りは公式と同じく通常の選択のときだけ展開する
# (installation_data.unpack_regular は pkgselect が立てる)。
# 4 番目の install 層は、5 層 (unpackfs・xfix・bootrepo・ctxfix・aptfix)
# の統合で、白抜きの蘇生・xattr 補正・bootloader 用 repo・context 修正を
# 1 層で運ぶ。起動の overlay・toram 複写・unpackfs 展開の順はどれも
# 親から子の 4 層で一致する。
# 使い方: sh tools/ubuntu-merge/add-lubuntu-install-layer.sh <入力ISO> <複製ISO>
unpack:
    -   source: "/cdrom/casper/common.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: true
    -   source: "/cdrom/casper/common.dl.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: "installation_data.unpack_regular"
    -   source: "/cdrom/casper/common.dl.lubuntu.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: "installation_data.unpack_regular"
    -   source: "/cdrom/casper/common.dl.lubuntu.install.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: "installation_data.unpack_regular"
