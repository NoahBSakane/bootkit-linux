# 設置用の層だけを展開する。liveとinstallの層は標的に入れない。
unpack:
    -   source: "/cdrom/casper/common.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: true
    -   source: "/cdrom/casper/common.dl.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: true
    -   source: "/cdrom/casper/common.dl.snap.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: "installation_data.unpack_regular"
    -   source: "/cdrom/casper/common.dl.snap.lubuntu.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: true
    -   source: "/cdrom/casper/common.dl.snap.lubuntu.std.squashfs"
        sourcefs: "squashfs"
        destination: ""
        condition: "installation_data.unpack_regular"
